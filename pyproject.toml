[project]
name = "harbor-hotels-voice-agent"
version = "1.0.0"
description = "Harbor Hotels phone booking voice agent on LiveKit, traced with Future AGI traceAI"
requires-python = ">=3.11,<3.14"
dependencies = [
  "livekit-agents>=1.6.9,<2",
  "livekit-plugins-deepgram>=1.6.10,<2",
  "livekit-plugins-anthropic>=1.6.10,<2",
  "livekit-plugins-silero>=1.6.10,<2",
  "fi-instrumentation-otel==1.1.0",
  "traceAI-livekit==0.1.1",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
